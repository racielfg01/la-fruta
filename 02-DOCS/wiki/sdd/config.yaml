version: 1
project:
  root: .
  stacks: [nextjs, react, node]
  package_managers: [npm]
  monorepo: false
  signals: [pocketbase, vercel, pwa, tailwind, typescript]
sdd:
  artifact_store: 02-DOCS/wiki/sdd
  execution_mode: interactive
  registry_path: .rsc/skill-registry.json
  review_budget:
    line_budget: 400
    file_budget: 12
  delivery_strategy:
    default: ask-on-risk
testing:
  strict_tdd: true
  runners: [vitest]
  commands:
    apply: ["npm install"]
    verify: ["npx tsc --noEmit", "npx vitest run", "npm run build"]
phase_rules:
  proposal: optional-on-ambiguity
  specify: requires intent or proposal
  plan: requires spec
  tasks: requires plan and spec
  analyze: requires spec plan tasks
  implement: requires analyze pass, strict_tdd when testing.strict_tdd is true
  verify: requires spec tasks evidence
  archive: requires verify record and review/ship outcome
models:
  enabled: false
  provider: opencode
  tiers:
    heavy: big-pickle
    balanced: big-pickle
    light: big-pickle
  phases:
    constitution: heavy
    specify: balanced
    clarify: balanced
    plan: heavy
    tasks: balanced
    analyze: heavy
    implement: balanced
    verify: balanced
    review: heavy
    ship: light
    debug: heavy
    worktrees: light
    sdd-init: light
  overrides: {}
